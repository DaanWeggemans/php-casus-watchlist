<div class="root">
    <form class="login" [formGroup]="formGroup.group" (ngSubmit)="edit()">
        <div>
            <label for="name">Name</label>
            <input class="input" id="name" type="text" formControlName="name">
            <validation-formgroup-error [errors]="formGroup.errors()['name']"></validation-formgroup-error>
        </div>
        <div>
            <label for="index">Index</label>
            <input class="input" id="index" type="number" min="1" formControlName="index">
            <validation-formgroup-error [errors]="formGroup.errors()['index']"></validation-formgroup-error>
        </div>
        <div class="actions">
            <button class="action" type="submit" [disabled]="isLoading()">
                <img src="/edit-icon.png" alt="Edit">
            </button>
            <button class="action" type="button" (click)="close.emit(undefined)">X</button>
        </div>
    </form>
</div>
