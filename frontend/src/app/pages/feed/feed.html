<div class="root">
    <app-header></app-header>
    <main>
        @for (feed of feeds(); track feed.id) {
            <div class="post">
                <div class="profile"></div>
                <p>{{ feed.id }}</p>
                <p>{{ feed.serie.name }}</p>
                <p>{{ feed.user.username }}</p>
            </div>
        }
    </main>
</div>
