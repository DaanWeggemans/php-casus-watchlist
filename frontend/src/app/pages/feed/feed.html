<div class="root">
    <app-header></app-header>
    <main>
        @for (feed of feeds(); track feed.id) {
            <div class="post">
                <div class="profile">
                    <div class="top">
                        <div class="profile-icon"></div>
                        <div class="username">{{ feed.user.username }}</div>
                        <div class="date-shared">
                            <span>Posted on: </span>
                            <span>{{ toReadable(feed.shared_on) }}</span>
                        </div>
                    </div>
                    <div class="bottom">
                        <button class="follow-button" [class.followed]="feed.user.is_followed" (click)="toggleFollow(feed)">{{ feed.user.is_followed ? "Unfollow" : "Follow" }}</button>
                    </div>
                </div>
                <div class="content">
                    <div class="information">
                        <h2 class="title">{{ feed.user.username }} has shared a {{ feed.serie.type }}: {{ feed.serie.name }}</h2>
                    </div>
                    <div class="cover">
                        <img [src]="feed.serie.image ?? 'https://static.thenounproject.com/png/3376954-200.png'" [alt]="feed.serie.name">
                    </div>
                </div>
            </div>
        }
    </main>
</div>
