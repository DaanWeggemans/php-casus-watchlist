<div class="root">
    <app-header></app-header>
    <main>
        <div class="franchises">
            @for (item of items(); track item.id) {
                <button class="franchise" (click)="selectFranchise(item)">
                    <div class="image">
                        <img src="https://static.thenounproject.com/png/3376954-200.png" alt="">
                    </div>
                    <p>{{ item.name }}</p>
                </button>
            }
        </div>
        <div [class]="`selected-franchise-container${franchise() !== undefined ? '' : ' closed'}`">
            <div class="selected-franchise">
                <h2>{{ franchise()?.name }}</h2>
            </div>
        </div>
    </main>
</div>
