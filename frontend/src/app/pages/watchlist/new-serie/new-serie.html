<form [formGroup]="formGroup.group" (ngSubmit)="create()">
    <section>
        <input type="text" formControlName="name">
        <validation-formgroup-error [errors]="formGroup.errors()['name']"></validation-formgroup-error>
    </section>
    <section>
        <input type="text" formControlName="type">
        <validation-formgroup-error [errors]="formGroup.errors()['type']"></validation-formgroup-error>
    </section>
    <section>
        <input type="checkbox" formControlName="done">
        <validation-formgroup-error [errors]="formGroup.errors()['done']"></validation-formgroup-error>
    </section>
    <section>
        <input type="file" (change)="onFileChange($event)">
        <validation-formgroup-error [errors]="formGroup.errors()['file']"></validation-formgroup-error>
    </section>
    <div class="actions">
        <input type="submit" value="Create">
    </div>
</form>
