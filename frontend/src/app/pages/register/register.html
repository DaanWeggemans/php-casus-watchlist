<div class="root">
    <div class="form">
        <h1 class="title">Register</h1>
        <form [formGroup]="formGroup.group" (ngSubmit)="register()">
            <section>
                <label for="username">Username</label>
                <input class="input" id="username" type="text" formControlName="username">
                <validation-formgroup-error [errors]="formGroup.errors()['username']"></validation-formgroup-error>
            </section>
            <section>
                <label for="email">Email</label>
                <input class="input" id="email" type="email" formControlName="email">
                <validation-formgroup-error [errors]="formGroup.errors()['email']"></validation-formgroup-error>
            </section>
            <section>
                <label for="password">Password</label>
                <input class="input" id="password" type="password" formControlName="password">
                <validation-formgroup-error [errors]="formGroup.errors()['password']"></validation-formgroup-error>
            </section>
            <div class="actions">
                <input class="action" type="submit" value="Register" [disabled]="isLoading()">
                <a class="action" routerLink="/login">Login</a>
            </div>
        </form>
    </div>
</div>
