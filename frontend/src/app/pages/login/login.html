<div class="root">
    <div class="form">
        <h1 class="title">Login</h1>
        <form [formGroup]="formGroup.group" (ngSubmit)="login()">
            <section>
                <label for="email">Email</label>
                <input id="email" type="email" formControlName="email">
                <validation-formgroup-error [errors]="formGroup.errors()['email']"></validation-formgroup-error>
            </section>
            <section>
                <label for="password">Password</label>
                <input id="password" type="password" formControlName="password">
                <validation-formgroup-error [errors]="formGroup.errors()['password']"></validation-formgroup-error>
            </section>
            <div class="actions">
                <input class="action" type="submit" value="Login" [disabled]="isLoading()">
                <a class="action" routerLink="/register">Register</a>
            </div>
        </form>
    </div>
</div>
